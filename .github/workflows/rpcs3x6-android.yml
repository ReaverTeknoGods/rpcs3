name: RPCS3X6 Android

on:
  workflow_dispatch:
    inputs:
      signed_test:
        description: "Build a production-signed release APK without publishing it"
        required: false
        default: false
        type: boolean
      signed_test_version:
        description: "Four-part version reserved for the signed test and its later release tag"
        required: false
        default: "0.0.116.38"
        type: string
  push:
    tags:
      - "rpcs3x6-v*"
  pull_request:
    paths:
      - "android/**"
      - "rpcs3/**"
      - "Utilities/**"
      - "Crypto/**"
      - "3rdparty/**"
      - "buildfiles/**"
      - "CMakeLists.txt"
      - ".github/workflows/rpcs3x6-android.yml"

permissions:
  contents: read

concurrency:
  group: rpcs3x6-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.31.6"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  KEYSTORE_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
  KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
  KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
  EXPECTED_CERT_SHA256: "c6d8de6b3b0847465e315b7efbe93fd58e940b7cf727b45322704c80e68ec8f1"

jobs:
  build:
    name: Build and verify arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      asset_name: ${{ steps.package.outputs.asset_name }}
      version_name: ${{ steps.version.outputs.version_name }}
      signed_build: ${{ steps.version.outputs.signed_build }}
      release_build: ${{ steps.version.outputs.release_build }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # RPCS3 carries historical third-party Android projects whose wrapper
          # jars are not used by this build and are absent from Gradle's known
          # checksum catalog. Validate the android/ wrapper in the build step
          # instead of rejecting unrelated vendored wrappers during setup.
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Derive Android version and variant
        id: version
        shell: bash
        env:
          SIGNED_TEST: ${{ inputs.signed_test }}
          SIGNED_TEST_VERSION: ${{ inputs.signed_test_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/rpcs3x6-v* ]]; then
            version_name="${GITHUB_REF_NAME#rpcs3x6-v}"
            signed_build=true
            release_build=true
            [[ "$version_name" =~ ^0\.0\.([0-9]+)\.([0-9]+)$ ]] || {
              echo "Tagged RPCS3X6 releases must use 0.0.BUILD.REVISION" >&2
              exit 1
            }
            build_number="${BASH_REMATCH[1]}"
            revision_number="${BASH_REMATCH[2]}"
            (( 10#$revision_number < 100 )) || {
              echo "RPCS3X6 release revision must be below 100" >&2
              exit 1
            }
            version_code=$((10#$build_number * 100 + 10#$revision_number))
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$SIGNED_TEST" == "true" ]]; then
            version_name="$SIGNED_TEST_VERSION"
            signed_build=true
            release_build=false
            [[ "$version_name" =~ ^0\.0\.([0-9]+)\.([0-9]+)$ ]] || {
              echo "Signed RPCS3X6 tests must use 0.0.BUILD.REVISION" >&2
              exit 1
            }
            build_number="${BASH_REMATCH[1]}"
            revision_number="${BASH_REMATCH[2]}"
            (( 10#$revision_number < 100 )) || {
              echo "RPCS3X6 test revision must be below 100" >&2
              exit 1
            }
            version_code=$((10#$build_number * 100 + 10#$revision_number))
          else
            version_name="0.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            signed_build=false
            release_build=false
            version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          fi
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must contain four numeric parts: $version_name" >&2
            exit 1
          }
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "signed_build=$signed_build" >> "$GITHUB_OUTPUT"
          echo "release_build=$release_build" >> "$GITHUB_OUTPUT"

      - name: Materialize release signing key
        if: steps.version.outputs.signed_build == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_ALIAS" && -n "$KEYSTORE_KEY_PASSWORD" && -n "$KEYSTORE_STORE_PASSWORD" ]] || {
            echo "Signed RPCS3X6 builds require the shared ANDROID_SIGNING_* production secrets" >&2
            exit 1
          }
          keystore="$RUNNER_TEMP/rpcs3x6-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [[ -s "$keystore" ]]
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build RPCS3X6
        working-directory: android
        shell: bash
        env:
          RPCS3X6_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RPCS3X6_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [[ "${{ steps.version.outputs.signed_build }}" == "true" ]]; then
            task=:app:assembleRelease
            test_task=:app:testReleaseUnitTest
          else
            task=:app:assembleDebug
            test_task=:app:testDebugUnitTest
          fi
          ./gradlew --no-daemon --stacktrace "$test_task" "$task"

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version_name }}"
          if [[ "${{ steps.version.outputs.signed_build }}" == "true" ]]; then
            source_apk="android/app/build/outputs/apk/release/rpcs3x6-release.apk"
            asset_name="rpcs3x6-${version}-android-arm64.apk"
            artifact_name="rpcs3x6-${version}-android-arm64"
            export REQUIRE_RELEASE_APK=1
            export REQUIRE_PRODUCTION_SIGNATURE=1
          else
            source_apk="android/app/build/outputs/apk/debug/rpcs3x6-debug.apk"
            asset_name="rpcs3x6-${version}-android-arm64-ci.apk"
            artifact_name="rpcs3x6-${version}-android-arm64-ci"
          fi
          [[ -s "$source_apk" ]]
          mkdir -p dist
          cp "$source_apk" "dist/$asset_name"
          bash android/scripts/verify-apk.sh "dist/$asset_name" "$version"
          (
            cd dist
            sha256sum "$asset_name" > "$asset_name.sha256"
          )
          {
            echo "package=com.teknogods.rpcs3x6"
            echo "version=$version"
            echo "abi=arm64-v8a"
            echo "commit=${GITHUB_SHA}"
            echo "signed=${{ steps.version.outputs.signed_build }}"
            echo "release=${{ steps.version.outputs.release_build }}"
          } > "dist/$asset_name.metadata.txt"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.asset_name }}
            dist/${{ steps.package.outputs.asset_name }}.sha256
            dist/${{ steps.package.outputs.asset_name }}.metadata.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged companion release
    if: needs.build.outputs.release_build == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/rpcs3x6-v* ]]; then
            if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "RPCS3X6 $VERSION_NAME" \
                --notes "Signed arm64-v8a TeknoParrotUI companion build."
            fi
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/$ASSET_NAME" \
              "dist/$ASSET_NAME.sha256" \
              "dist/$ASSET_NAME.metadata.txt"
          fi

          rolling_tag="rpcs3x6-android"
          rolling_asset="rpcs3x6-android-arm64.apk"
          cp "dist/$ASSET_NAME" "dist/$rolling_asset"
          (cd dist && sha256sum "$rolling_asset" > "$rolling_asset.sha256")
          cp "dist/$ASSET_NAME.metadata.txt" "dist/$rolling_asset.metadata.txt"
          if ! gh release view "$rolling_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$rolling_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "RPCS3X6 Android" \
              --notes "Rolling signed arm64-v8a TeknoParrotUI companion build."
          else
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$rolling_tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$rolling_tag" --repo "$GITHUB_REPOSITORY" --title "RPCS3X6 Android $VERSION_NAME"
          fi
          gh release upload "$rolling_tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/$rolling_asset" \
            "dist/$rolling_asset.sha256" \
            "dist/$rolling_asset.metadata.txt"
